# PHP Golden JSON тесты (сериализация/десериализация)
sdk-golden-php:
  extends: .php-test-base
  stage: test
  needs:
    - job: generate-sdk-php
      artifacts: true
  rules:
    - if: '$SDK_LANGUAGES == "" || $SDK_LANGUAGES =~ /php/'
      when: on_success
  script:
    - |
      if [ -d "tests/php" ]; then
        cd tests/php
        # bootstrap.php обязателен для PHPUnit; создаём, если нет
        if [ ! -f "bootstrap.php" ]; then
          printf '%s\n' '<?php $b=dirname(__DIR__,2); require __DIR__."/vendor/autoload.php"; if(file_exists($b."/clients/php/autoload.php")) require $b."/clients/php/autoload.php";' > bootstrap.php
        fi
        composer install --no-interaction
        echo "=== Golden tests (PHP) ==="
        vendor/bin/phpunit --testsuite golden --testdox
      else
        echo "WARNING: tests/php directory not found"
        exit 1
      fi

# Python Golden JSON тесты
sdk-golden-python:
  stage: test
  image: python:3.10
  needs:
    - job: generate-sdk-python
      artifacts: true
  rules:
    - if: '$SDK_LANGUAGES == "" || $SDK_LANGUAGES =~ /python/'
      when: on_success
  cache:
    key:
      files:
        - clients/python/requirements.txt
        - tests/python/requirements.txt
    paths:
      - .cache/pip/
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  script:
    - python -m pip install -r clients/python/requirements.txt -r tests/python/requirements.txt
    - python -m compileall -q clients/python/src/moysklad_remap_12_sdk
    - python -m pytest tests/python/golden -v

sdk-golden-java:
  extends: .maven-jdk11-image
  stage: test
  needs:
    - job: generate-sdk-java
      artifacts: true
      optional: true
  rules:
    - if: '$SDK_LANGUAGES == "" || $SDK_LANGUAGES =~ /java/'
      when: on_success
  script:
    - |
      if [ -d "tests/java/assertions" ]; then
        echo "=== Golden tests (Java) ==="
        mvn test -Dtest=**/golden/** -Dsurefire.failIfNoSpecifiedTests=false
      else
        echo "WARNING: tests/java/assertions directory not found"
        exit 1
      fi

# TypeScript Golden JSON тесты
sdk-golden-typescript:
  extends:
    - .openapitools-image
    - .npm-cache
  stage: test
  needs:
    - job: generate-sdk-typescript
      artifacts: true
  rules:
    - if: '$SDK_LANGUAGES == "" || $SDK_LANGUAGES =~ /typescript/'
      when: on_success
  variables:
    npm_config_registry: $NPM_REGISTRY_URL
  script:
    - |
      if [ -d "tests/typescript" ]; then
        echo "=== Golden tests (TypeScript) ==="
        sh scripts/local-test-golden.sh typescript
      else
        echo "WARNING: tests/typescript directory not found"
        exit 1
      fi

