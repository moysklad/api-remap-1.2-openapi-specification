check-openapi-changes:
  extends: .openapitools-image
  stage: changes-check
  # Пути, изменения в которых с прошлого тега считаются поводом для релиза SDK
  variables:
    SDK_RELEASE_PATHS: |
      src/
      customtemplates/
      java-sdk-config.yaml
      python-sdk-config.yaml
      typescript-sdk-config.yaml
      scripts/prepare-python-sdk-layout.py
  rules:
    # Теги берём из текущего репозитория (git describe в клоне пайплайна)
    # Запускаем при merge/push в master и при ручном запуске (web) на master
    - if: '$CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master"'
      when: on_success
    - when: never
  script:
    - |
      set -e
      echo "Checking OpenAPI changes relative to last tag (current repo)..."
      LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
      if [ -z "$LAST_TAG" ]; then
        echo "No tags found. Skipping check and allowing pipeline to continue."
        exit 0
      fi

      if git diff --quiet "$LAST_TAG"...HEAD -- src; then
        echo "ERROR: No changes in src/ OpenAPI specification relative to tag $LAST_TAG."
        echo "Please ensure that OpenAPI specification changes are present before running this pipeline."
      if git diff --quiet "$LAST_TAG"...HEAD -- "$@"; then
        echo "ERROR: Не зафиксировано изменений в файлах, требующихся для генерации новой версии SDK $LAST_TAG."
        echo "Please ensure that SDK generation inputs changed before running this pipeline."
        exit 1
      else
        echo "SDK release input changes detected relative to tag $LAST_TAG. Continuing pipeline."
      fi

validate:
  extends:
    - .openapitools-image
    - .npm-cache
  stage: verify
  needs:
    - job: check-openapi-changes
      optional: true
  script:
    - npm ci
    - npm run validate
