# Проверка fat/slim Java SDK артефактов
sdk-verify-java-fat-slim:
  extends: .maven-jdk17-image
  stage: test
  needs:
    - job: generate-sdk-java
      artifacts: true
  rules:
    - if: '$SDK_LANGUAGES == "" || $SDK_LANGUAGES =~ /java/'
      when: on_success
  script:
    - |
      if [ -d "clients/java" ]; then
        echo "=== Verify Java SDK fat/slim artifacts ==="
        sh scripts/sdk-verify-java-fat-slim.sh
      else
        echo "WARNING: clients/java directory not found"
        exit 1
      fi
