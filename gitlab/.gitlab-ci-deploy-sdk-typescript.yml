# Deploy TypeScript SDK on npm

.deploy-sdk-typescript-base:
  extends: .openapitools-image
  stage: deploy-sdk
  variables:
    npm_config_registry: $NPM_REGISTRY_URL

deploy-to-npm-prerelease:
  extends: .deploy-sdk-typescript-base
  needs:
    - job: prep-branch-and-mr-typescript
      artifacts: true
  rules:
    # Автоматически при push в ветку (кроме master/release)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "release" && $CI_COMMIT_TAG == null'
      when: on_success
    # В пайплайне, запущенном вручную на ветке (кроме master/release)
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "release" && $CI_COMMIT_TAG == null'
      when: on_success
    - when: never
  before_script:
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is not set. Cannot publish to npm."
        exit 1
      fi
    # Auth only in the job user config; never write tokens into the SDK repo or committed .npmrc
    - npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
    - cd sdk-repo
    - export TZ='Europe/Moscow'
  script:
    # Same version idea as Java Artifactory ({branch}-{pipeline-id}); npm needs valid semver
    - RAW_VERSION="${CI_COMMIT_REF_NAME}-${CI_PIPELINE_ID}"
    - SAFE_PRERELEASE=$(printf '%s' "$RAW_VERSION" | sed 's/[^0-9A-Za-z.-]/-/g')
    - PACKAGE_VERSION="0.0.0-${SAFE_PRERELEASE}"
    - DIST_TAG="${CI_COMMIT_REF_SLUG}"
    - npm pkg set "version=${PACKAGE_VERSION}"
    - npm install --ignore-scripts --no-audit --no-fund
    - npm run build
    - TGZ="$(npm pack | tail -n1)"
    - npm publish "$TGZ" --tag "$DIST_TAG"
    - echo "Complete. Version $PACKAGE_VERSION (dist-tag $DIST_TAG)"

deploy-to-npm:
  extends: .deploy-sdk-typescript-base
  needs:
    - job: merge-branch-typescript
      artifacts: true
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE == "push"'
      when: on_success
  before_script:
    - |
      if [ -z "$NPM_TOKEN" ]; then
        echo "NPM_TOKEN is not set. Cannot publish to npm."
        exit 1
      fi
    - npm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
    - |
      if [ ! -d "sdk-repo" ]; then
        echo "Release artifact expired. Restore release artefact..."

        if [ -z "$CICD_PAT_TYPESCRIPT" ]; then
          echo "CICD_PAT_TYPESCRIPT is not set. Cannot access internal TypeScript SDK repository."
          exit 1
        fi

        echo "Getting tag from spec repo."
        git clone "${CI_REPOSITORY_URL}" spec-repo
        git -C spec-repo fetch origin "$CI_COMMIT_REF_NAME" --tags
        git -C spec-repo checkout "$CI_COMMIT_REF_NAME"
        TAG="$(git -C spec-repo describe --tags --abbrev=0 2>/dev/null || true)"
        if [ -z "$TAG" ]; then
          echo "No release tag found in spec repo. Stop npm release"
          exit 1
        fi

        echo "Cloning SDK repository to sdk-repo."
        SDK_REPO_URL="https://oauth2:${CICD_PAT_TYPESCRIPT}@git.company.lognex/moysklad/misc/remap-1.2-typescript-sdk.git"
        git clone --depth=1 --filter=blob:none --single-branch --branch master "$SDK_REPO_URL" sdk-repo
      else
        echo "Using sdk-repo from upstream artifacts."
        TAG_FILE="sdk-repo/typescript-release-tag.txt"
        if [ -s "$TAG_FILE" ]; then
          TAG="$(tr -d '\r\n' < "$TAG_FILE")"
        else
          echo "No release tag found. Stop npm release"
          exit 1
        fi
      fi
    - cd sdk-repo
    - export TZ='Europe/Moscow'
  script:
    - echo "Using release tag $TAG as npm version"
    - npm pkg set "version=${TAG}"
    - npm install --ignore-scripts --no-audit --no-fund
    - npm run build
    - TGZ="$(npm pack | tail -n1)"
    - npm publish "$TGZ" --tag latest
    - echo "Complete. Version $TAG (dist-tag latest)"
