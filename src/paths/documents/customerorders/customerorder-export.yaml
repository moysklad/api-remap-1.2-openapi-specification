post:
  operationId: exportCustomerOrder
  tags:
    - CustomerOrders
  summary: Запрос на печать Заказа покупателя
  description: |
    Запрос на формирование печатной формы для Заказа покупателя.
    При готовности сервер возвращает пустой ответ с кодом 303 и заголовком Location.
  x-location-response: true
  parameters:
    - $ref: '../../../components/parameters.yaml#/entityId'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/ContentTypeJson'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../openapi.yaml#/components/schemas/ExportRequest'
  responses:
    '202':
      description: Печатная форма еще не готова, в Location передана ссылка на статус печати
      headers:
        Location:
          $ref: '../../../components/response-headers.yaml#/PrintLocation'
    '303':
      description: Печатная форма готова, в Location передана ссылка на файл
      headers:
        Location:
          $ref: '../../../components/response-headers.yaml#/PrintLocation'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
