get:
  operationId: getCustomerOrderPublications
  tags:
    - CustomerOrders
  summary: Получить список Публикаций Заказа покупателя
  description: Запрос на получение списка Публикаций по указанному Заказу покупателя.
  parameters:
    - $ref: '../../../components/parameters.yaml#/entityId'
    - $ref: '../../../components/parameters.yaml#/limit'
    - $ref: '../../../components/parameters.yaml#/offset'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/PublicationList'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'

post:
  operationId: createCustomerOrderPublication
  tags:
    - CustomerOrders
  summary: Создать Публикацию Заказа покупателя
  description: Запрос на публикацию Заказа покупателя.
  parameters:
    - $ref: '../../../components/parameters.yaml#/entityId'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/ContentTypeJson'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../openapi.yaml#/components/schemas/Publication'
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/Publication'
    '201':
      description: Успешный запрос
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/Publication'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
