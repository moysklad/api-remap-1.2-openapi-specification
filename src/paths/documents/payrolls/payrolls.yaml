get:
  operationId: getPayrolls
  tags:
    - Payrolls
  summary: Получить список Начислений зарплаты
  description: Запрос всех Начислений зарплаты на данной учетной записи
  parameters:
    - $ref: '../../../components/parameters.yaml#/limit'
    - $ref: '../../../components/parameters.yaml#/offset'
    - $ref: '../../../components/parameters.yaml#/search'
    - $ref: '../../../components/parameters.yaml#/filter'
    - $ref: '../../../components/parameters.yaml#/expand'
    - $ref: '../../../components/parameters.yaml#/order'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/PayrollList'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'

post:
  operationId: createPayroll
  tags:
    - Payrolls
  summary: Создать Начисление зарплаты
  description: Создание Начисления зарплаты
  parameters:
    - $ref: '../../../components/parameters.yaml#/expand'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/ContentTypeJson'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../openapi.yaml#/components/schemas/Payroll'
  responses:
    '200':
      description: Начисление зарплаты успешно создано
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/Payroll'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
