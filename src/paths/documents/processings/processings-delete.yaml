post:
  x-batch-response: true
  operationId: deleteProcessingBatch
  tags:
    - Processings
  summary: Массовое удаление Processing
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../openapi.yaml#/components/schemas/Processing'
          minItems: 1
          maxItems: 1000
  responses:
    '200':
      description: Результат по каждому элементу (успех или объект ошибки)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../../openapi.yaml#/components/schemas/DeleteRowResult'
    '404':
      $ref: '../../../components/responses.yaml#/BatchDeleteError'
    '412':
      $ref: '../../../components/responses.yaml#/BatchDeleteError'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
  parameters:
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/ContentTypeJson'
