post:
  operationId: addCommissionReportInFiles
  tags:
    - CommissionReportIns
  summary: Добавить файлы к Полученному отчету комиссионера
  description: |
    Добавить новые Файлы к Полученному отчету комиссионера. В одном запросе можно добавить максимум 10 Файлов.
    В поле `content` нужно указать файл, закодированный в Base64, в поле `filename` — имя файла с расширением.
  parameters:
    - $ref: '../../../components/parameters.yaml#/entityId'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/ContentTypeJson'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '../../../openapi.yaml#/components/schemas/FileUpload'
  responses:
    '200':
      description: Файлы успешно добавлены. Результат — массив всех Файлов Полученного отчета комиссионера.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../../openapi.yaml#/components/schemas/File'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
