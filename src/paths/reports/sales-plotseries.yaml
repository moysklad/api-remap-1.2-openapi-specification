get:
  operationId: getReportSalesPlotSeries
  tags:
    - Reports
  summary: Получить показатели продаж
  description: |
    Запрос показателей продаж за период с разбивкой по часам, дням или месяцам.
    В показателях продаж учитываются отгрузки, розничные продажи и полученные отчеты комиссионера.
    Для доступа к отчету требуется право на просмотр показателей `viewDashboard`.
  parameters:
    - name: momentFrom
      in: query
      required: true
      description: Начало периода отчета в формате YYYY-MM-DD HH:MM:SS
      schema:
        type: string
    - name: momentTo
      in: query
      required: true
      description: Конец периода отчета в формате YYYY-MM-DD HH:MM:SS
      schema:
        type: string
    - name: interval
      in: query
      required: true
      description: Интервал построения отчета
      schema:
        type: string
        enum:
          - hour
          - day
          - month
    - name: filter
      in: query
      required: false
      description: |
        Фильтрация показателей продаж. Доступные поля: `organization`, `store`, `project`, `retailStore`.
        Можно указать несколько значений; пустые значения недопустимы.
      schema:
        type: string
    - $ref: '../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../components/headers.yaml#/LognexAcceptTimezone'
  responses:
    '200':
      description: Успешный запрос. JSON представление отчета показателей продаж
      headers:
        X-Lognex-Content-Timezone:
          description: |
            Заголовок ответа. В нем указывается (как думает сервер) текущая дата на клиенте в RFC 3522.
            Пример: `Wed, 16 Aug 2017 23:07:01 +0700`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ReportSalesPlotSeriesList'
    default:
      $ref: '../../components/responses.yaml#/CommonError'
