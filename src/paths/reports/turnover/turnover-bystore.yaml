get:
  operationId: getReportTurnoverByStore
  tags:
    - Reports
  summary: Получить Обороты по товару с детализацией по складам
  description: Запрос отчета «Обороты по товару с детализацией по складам».
  parameters:
    - $ref: '../../../components/reportParameters.yaml#/requiredFilter'
    - $ref: '../../../components/reportParameters.yaml#/momentFrom'
    - $ref: '../../../components/reportParameters.yaml#/momentTo'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/LognexAcceptTimezone'
  responses:
    '200':
      description: Успешный запрос. Результат - JSON представление отчета
      headers:
        X-Lognex-Content-Timezone:
          description: |
            Заголовок ответа. В нем указывается (как думает сервер) текущая дата на клиенте в RFC 3522.
            Пример: `Wed, 16 Aug 2017 23:07:01 +0700`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/ReportTurnoverByStoreList'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
