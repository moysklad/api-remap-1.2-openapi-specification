get:
  operationId: getReportTurnoverAll
  tags:
    - Reports
  summary: Получить Обороты по товарам
  description: Запрос отчета «Обороты по товарам» — общий отчет по оборотам товаров и модификаций.
  parameters:
    - $ref: '../../../components/parameters.yaml#/limit'
    - $ref: '../../../components/parameters.yaml#/offset'
    - $ref: '../../../components/parameters.yaml#/filter'
    - $ref: '../../../components/reportParameters.yaml#/momentFrom'
    - $ref: '../../../components/reportParameters.yaml#/momentTo'
    - name: groupBy
      in: query
      required: false
      description: Тип, по которому нужно сгруппировать выдачу. Значение по умолчанию `product`.
      schema:
        type: string
        enum:
          - product
          - variant
        default: product
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/LognexAcceptTimezone'
  responses:
    '200':
      description: Успешный запрос. Результат - JSON представление отчета
      headers:
        X-Lognex-Content-Timezone:
          description: |
            Заголовок ответа. В нем указывается (как думает сервер) текущая дата на клиенте в RFC 3522.
            Пример: `Wed, 16 Aug 2017 23:07:01 +0700`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/ReportTurnoverList'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
