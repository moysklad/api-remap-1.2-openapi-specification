get:
  operationId: getStockBySlotCurrent
  tags:
    - ReportsStockCurrent
  summary: Получить Краткий отчет об остатках по ячейкам
  description: |
    Краткий отчет об остатках с группировкой по номенклатуре, складам и ячейкам.
    Возвращает один тип значения остатка, выбранный параметром `stockType`.

    Для запроса требуется фильтрация по `assortmentId` или `storeId`.
  parameters:
    - name: include
      in: query
      required: false
      description: |
        Управляет включением нулевых остатков.
        По умолчанию выводятся только ненулевые значения.
      schema:
        type: string
        enum:
          - zeroLines
    - name: stockType
      in: query
      required: false
      description: |
        Тип рассчитываемого значения остатка. По умолчанию `stock`.
      schema:
        type: string
        enum:
          - stock
          - freeStock
          - quantity
          - reserve
          - inTransit
        default: stock
    - name: filter
      in: query
      required: false
      description: |
        Фильтрация отчета по ID сущностей.
        Поддерживаемые поля: `assortmentId`, `storeId`.
      schema:
        type: string
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос. Результат - JSON представление отчета
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../../openapi.yaml#/components/schemas/StockCurrentBySlot'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
