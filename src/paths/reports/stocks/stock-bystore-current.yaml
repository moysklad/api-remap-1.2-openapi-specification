get:
  operationId: getStockByStoreCurrent
  tags:
    - ReportsStockCurrent
  summary: Получить Краткий отчет об остатках по складам
  description: |
    Краткий отчет об остатках с группировкой по номенклатуре и складам.
    Возвращает один тип значения остатка, выбранный параметром `stockType`.
  parameters:
    - $ref: '../../../components/parameters.yaml#/stockCurrentInclude'
    - $ref: '../../../components/parameters.yaml#/stockCurrentChangedSince'
    - $ref: '../../../components/parameters.yaml#/stockCurrentStockType'
    - name: withRecalculate
      in: query
      required: false
      description: |
        Включает позиции, по которым остаток пересчитывается.
        Для таких позиций значение остатка может быть `null`.
      schema:
        type: boolean
    - $ref: '../../../components/parameters.yaml#/stockCurrentFilter'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос. Результат - JSON представление отчета
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../../openapi.yaml#/components/schemas/StockCurrentByStore'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
