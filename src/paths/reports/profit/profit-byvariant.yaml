get:
  operationId: getReportProfitByVariant
  tags:
    - Reports
  summary: Получить прибыльность по модификациям
  description: |
    Запрос отчета «Прибыльность по модификациям». В отчете учитываются модификации,
    товары, услуги и комплекты.
    Для доступа к отчету требуется право на просмотр отчета «Прибыльность».
  parameters:
    - $ref: '../../../components/parameters.yaml#/limit'
    - $ref: '../../../components/parameters.yaml#/offset'
    - $ref: '../../../components/parameters.yaml#/filter'
    - $ref: '../../../components/reportParameters.yaml#/momentFrom'
    - $ref: '../../../components/reportParameters.yaml#/momentTo'
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
    - $ref: '../../../components/headers.yaml#/LognexAcceptTimezone'
  responses:
    '200':
      description: Успешный запрос. Результат - JSON представление отчета
      content:
        application/json:
          schema:
            $ref: '../../../openapi.yaml#/components/schemas/ReportProfitByVariantList'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
