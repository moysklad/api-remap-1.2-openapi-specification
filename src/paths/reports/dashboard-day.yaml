get:
  operationId: getReportDashboardDay
  tags:
    - Reports
  summary: Получить показатели за день
  description: |
    Запрос показателей за день.
    Для доступа к отчету требуется право на просмотр показателей `viewDashboard`.
  parameters:
    - $ref: '../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос. JSON представление показателей за день
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/ReportDashboard'
    default:
      $ref: '../../components/responses.yaml#/CommonError'
