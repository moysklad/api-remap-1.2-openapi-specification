delete:
  operationId: deleteVariantImage
  tags:
    - Variants
  summary: Удалить изображение Модификации
  description: Удаление Изображения Модификации.
  parameters:
    - $ref: '../../../components/parameters.yaml#/entityId'
    - name: imageId
      in: path
      required: true
      description: ID изображения
      schema:
        type: string
        format: uuid
    - $ref: '../../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Изображение успешно удалено
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
