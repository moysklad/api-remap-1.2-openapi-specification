post:
  operationId: createStoreSlots
  tags:
  - Stores
  summary: Массовое создание и обновление ячеек склада
  parameters:
  - name: storeId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  - $ref: '../../../components/headers.yaml#/AcceptHeader'
  - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../openapi.yaml#/components/schemas/StoreSlot'
          minItems: 1
          maxItems: 1000
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            type: array
            items:
              oneOf:
                - $ref: '../../../openapi.yaml#/components/schemas/StoreSlot'
                - $ref: '../../../openapi.yaml#/components/schemas/Errors'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
