post:
  operationId: createBundleComponents
  tags:
  - Bundles
  summary: Массовое добавление и обновление компонентов Комплекта
  parameters:
  - $ref: '../../../components/parameters.yaml#/entityId'
  - $ref: '../../../components/headers.yaml#/AcceptHeader'
  - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  - $ref: '../../../components/parameters.yaml#/expand'
  - $ref: '../../../components/headers.yaml#/ContentTypeJson'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../openapi.yaml#/components/schemas/BundleComponent'
          minItems: 1
          maxItems: 1000
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            type: array
            items:
              oneOf:
              - $ref: '../../../openapi.yaml#/components/schemas/BundleComponent'
              - $ref: '../../../openapi.yaml#/components/schemas/Errors'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
