post:
  x-batch-response: true
  operationId: createBundlesBatch
  tags:
  - Bundles
  summary: Массовое создание и обновление Комплектов
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../openapi.yaml#/components/schemas/Bundle'
          minItems: 1
          maxItems: 1000
  responses:
    '200':
      description: Успешный запрос
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../../openapi.yaml#/components/schemas/BatchResponseEntity'
    '404':
      $ref: '../../../components/responses.yaml#/BatchEntityError'
    '412':
      $ref: '../../../components/responses.yaml#/BatchEntityError'
    default:
      $ref: '../../../components/responses.yaml#/CommonError'
  parameters:
  - $ref: '../../../components/headers.yaml#/AcceptHeader'
  - $ref: '../../../components/headers.yaml#/AcceptEncoding'
  - $ref: '../../../components/parameters.yaml#/expand'
  - $ref: '../../../components/headers.yaml#/ContentTypeJson'
