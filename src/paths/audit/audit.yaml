get:
  operationId: getAuditContexts
  tags:
    - Audit
  summary: Получить контексты аудита
  description: |
    Возвращает общую ленту изменений (контексты аудита).
    Поддерживает пагинацию и фильтрацию через параметр `filter`.
  parameters:
    - $ref: '../../components/parameters.yaml#/limit'
    - $ref: '../../components/parameters.yaml#/offset'
    - $ref: '../../components/parameters.yaml#/filter'
    - $ref: '../../components/headers.yaml#/AcceptHeader'
    - $ref: '../../components/headers.yaml#/AcceptEncoding'
  responses:
    '200':
      description: Успешный запрос. JSON представление списка контекстов аудита
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/AuditList'
    default:
      $ref: '../../components/responses.yaml#/CommonError'
