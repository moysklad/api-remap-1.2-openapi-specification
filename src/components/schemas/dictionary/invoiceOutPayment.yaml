type: object
description: |
  Элемент массива `payments` документа invoiceOut.
  Ссылка или раскрытый платеж; `linkedSum` может отсутствовать.
x-polymorphic-discriminator:
  path: meta.type
  mappings:
    - type: paymentin
      componentName: InvoiceOutPaymentPaymentIn
    - type: cashin
      componentName: InvoiceOutPaymentCashIn
properties:
  meta:
    $ref: '../common/meta.yaml'
  linkedSum:
    type: number
    format: double
    description: Сумма, оплаченная по данному документу; может отсутствовать у ссылки
required:
  - meta
