type: object
description: Запрос на печать
properties:
  template:
    $ref: '../../../openapi.yaml#/components/schemas/EmbeddedTemplate'
  extension:
    type: string
    description: |
      Расширение, в котором нужно напечатать форму.
      Допустимые значения: xls, pdf, html, ods.
    enum:
      - xls
      - pdf
      - html
      - ods
  templates:
    type: array
    description: |
      Набор шаблонов для печати комплекта документов.
      При использовании templates поле extension указывать не нужно.
    minItems: 1
    nullable: true
    items:
      $ref: '../../../openapi.yaml#/components/schemas/TemplateComposition'
