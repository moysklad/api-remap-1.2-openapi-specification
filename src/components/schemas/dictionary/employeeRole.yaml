type: object
description: |
  Роль сотрудника: владелец аккаунта, системный администратор, кассир,
  сотрудник производства, пользовательская или индивидуальная роль.
  Системные роли имеют meta.type = systemrole, индивидуальная — individualrole,
  пользовательская — customrole. Пользовательская роль описана в CustomRole.
  Роль сотрудника производства доступна при подключенной опции «Управление производством».
  Пользовательские роли и индивидуальные права, отличающиеся от значений по умолчанию,
  доступны на тарифах «Профессиональный» и «Корпоративный».
# x-entity-static-builder не задан: у роли нет id, а meta.type и href зависят от типа роли.
properties:
  meta:
    description: |
      Метаданные роли. Для системных ролей href заканчивается на
      /entity/role/owner, /admin, /cashier или /worker; для индивидуальной —
      /entity/role/individual; для пользовательской — /entity/role/{id}.
    $ref: '../common/meta.yaml'
  permissions:
    type: object
    description: |
      Настраиваемые права индивидуальной роли. В JSON передаются объектом,
      где ключи — названия пермиссий, значения — Boolean или объекты прав сущностей.
      При передаче permissions неуказанные пермиссии выставляются в NO,
      кроме view = ALL для currency, country и uom.
      Право view неизменяемо и равно ALL для currency, country, taxrate и uom.
      Без permissions сохраняются ранее заданные индивидуальные права сотрудника;
      если их не было, используются значения по умолчанию.
      Значения по умолчанию из документации не подставляются SDK автоматически.
    nullable: true
    properties:
      apiRequest:
        type: boolean
        description: Доступ по АПИ
      accountDelete:
        type: boolean
        description: Удалять аккаунт
      deleteFromRecycleBin:
        type: boolean
        description: Очищать корзину
      editCurrencyRateOfDocument:
        type: boolean
        description: Редактировать курс валюты документа
      editDocumentTemplates:
