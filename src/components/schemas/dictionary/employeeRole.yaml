        description: Редактировать документы закрытого периода
      exportData:
        type: boolean
        description: Экспортировать данные
      importData:
        type: boolean
        description: Импортировать данные
      listenCalls:
        type: boolean
        description: Прослушивание звонков
      onlineShops:
        type: boolean
        description: Интернет магазины
      ownerAssign:
        type: boolean
        description: Передавать владение аккаунтом
      ownerDataUpdate:
        type: boolean
        description: Редактировать данные владельца
