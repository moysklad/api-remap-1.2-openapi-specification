type: object
description: |
  Элемент массива `payments` возврата поставщику.
  Допустимые `meta.type`: paymentin, cashin. Поле `linkedSum` сохраняется у элемента связи.
x-polymorphic-discriminator:
  path: meta.type
  mappings:
    - type: paymentin
      componentName: PurchaseReturnPaymentPaymentIn
    - type: cashin
      componentName: PurchaseReturnPaymentCashIn
properties:
  meta:
    $ref: '../common/meta.yaml'
  linkedSum:
    type: number
    format: double
    description: Сумма, оплаченная по данному документу; может отсутствовать у ссылки
required:
  - meta
