type: object
description: |
  Элемент массива `payments` документа commissionReportOut.
  Ссылка или раскрытый платеж; `linkedSum` может отсутствовать.
x-polymorphic-discriminator:
  path: meta.type
  mappings:
    - type: paymentout
      componentName: CommissionReportOutPaymentPaymentOut
    - type: cashout
      componentName: CommissionReportOutPaymentCashOut
properties:
  meta:
    $ref: '../common/meta.yaml'
  linkedSum:
    type: number
    format: double
    description: Сумма, оплаченная по данному документу; может отсутствовать у ссылки
required:
  - meta
