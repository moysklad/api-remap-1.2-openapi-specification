type: object
description: |
  Права на сущность. BASE включает view, create, update и delete;
  DICTIONARY дополнительно включает print; OPERATION — print и approve.
  Для GTINList используются view, create и delete, для trackingCodeList — view и print.
  Известные значения описаны в PermissionValue. Область действия расширяется по цепочкам
  NO → OWN → OWN_SHARED → OWN_GROUP_SHARED → ALL и
  NO → OWN → OWN_GROUP → OWN_GROUP_SHARED → ALL.
  Неуказанное действие запрещено сотруднику.
properties:
  view:
    type: string
    description: Смотреть. Известные значения описаны в PermissionValue.
  print:
    type: string
    description: Печатать. Известные значения описаны в PermissionValue. Значение совпадает с view или отсутствует.
  create:
    type: string
    description: Создавать. Известные значения описаны в PermissionValue. Значение совпадает с view или отсутствует.
  update:
    type: string
    description: Редактировать. Известные значения описаны в PermissionValue. Область действия не шире view; поле может отсутствовать.
  delete:
    type: string
    description: Удалять. Известные значения описаны в PermissionValue. Значение совпадает с update или отсутствует.
  approve:
    type: string
    description: Проводить. Известные значения описаны в PermissionValue. Значение совпадает с view или отсутствует.
