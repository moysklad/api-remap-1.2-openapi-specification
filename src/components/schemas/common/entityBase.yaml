EntityWithMeta:
  type: object
  description: |
    Базовый полиморфный тип для сущностей с `meta`.
    Конкретный тип определяется по `meta.type`.
  x-polymorphic-parent: BatchResponseEntity
  properties:
    meta:
      $ref: './meta.yaml'
  x-polymorphic-discriminator:
    path: meta.type
    mappings: *entityWithMetaPolymorphicMappings

ProductMarker:
  type: object
  description: |
    Базовый полиморфный тип для сущностей номенклатуры.
    Конкретный тип определяется по `meta.type`.
  x-polymorphic-parent: EntityWithMeta
  x-implements: MetaEntity
  properties:
    id:
      type: string
      format: uuid
      description: ID товара
      readOnly: true
  x-polymorphic-discriminator:
    path: meta.type
    mappings:
      - type: bundle
        componentName: Bundle
      - type: consignment
        componentName: Consignment
      - type: variant
        componentName: Variant
      - type: product
        componentName: Product
      - type: service
        componentName: Service

DiscountAbstract:
  type: object
  x-polymorphic-discriminator:
    path: meta.type
    mappings:
      - type: accumulationdiscount
        componentName: AccumulationDiscount
      - type: personaldiscount
        componentName: PersonalDiscount
      - type: specialpricediscount
        componentName: SpecialPriceDiscount
      - type: discount
        componentName: Discount
      - type: bonusprogram
        componentName: BonusProgram
  required:
    - meta
  properties:
    id:
      type: string
      format: uuid
      description: ID дополнительного поля
      readOnly: true
    meta:
      description: Метаданные скидки
      $ref: '../common/meta.yaml'
    accountId:
      type: string
      format: uuid
      description: ID учетной записи
      readOnly: true
    name:
      type: string
      maxLength: 255
      description: Наименование товара
    active:
      type: boolean
      description: Включена ли скидка
    allAgents:
      type: boolean
      description: Для всех ли агентов скидка
    agentTags:
      type: array
      nullable: true
      description: Тэги агентов
      items:
        type: string
    allProducts:
      type: boolean
      description: Действует ли скидка на все товары
    assortment:
      type: array
      description: Массив метаданных товаров, услуг и модификаций
      nullable: true
      items:
        $ref: '../../../openapi.yaml#/components/schemas/DiscountAssortmentItem'
