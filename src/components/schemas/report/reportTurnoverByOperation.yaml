type: object
description: Строка отчета «Обороты по товару с детализацией по документам»
properties:
  assortment:
    description: Краткое представление номенклатуры в отчете
    $ref: '../../../openapi.yaml#/components/schemas/ReportTurnoverAssortment'
  store:
    type: object
    description: Склад
    properties:
      meta:
        $ref: '../common/meta.yaml'
      name:
        type: string
        maxLength: 255
        description: Наименование склада
  operation:
    description: Документ, связанный с номенклатурой
    $ref: '../../../openapi.yaml#/components/schemas/ReportTurnoverOperation'
  quantity:
    type: number
    format: double
    description: Количество номенклатуры в документе
  cost:
    type: number
    format: double
    description: Себестоимость номенклатуры в копейках в документе
  sum:
    type: number
    format: double
    description: Сумма себестоимостей в копейках
