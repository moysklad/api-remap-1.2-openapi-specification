type: object
description: Строка отчета «Показатели контрагентов»
properties:
  meta:
    description: Метаданные отчета по данному контрагенту
    $ref: '../common/meta.yaml'
  counterparty:
    type: object
    description: Краткое представление контрагента
    properties:
      meta:
        $ref: '../common/meta.yaml'
      id:
        type: string
        format: uuid
        description: ID контрагента
      name:
        type: string
        maxLength: 255
        description: Наименование контрагента
      externalCode:
        type: string
        maxLength: 255
        description: Внешний код контрагента
      companyType:
        type: string
        description: Тип контрагента. Известные значения описаны в CompanyType
      inn:
        type: string
        maxLength: 255
        description: ИНН контрагента
      phone:
        type: string
        description: Номер телефона
      email:
        type: string
        format: email
        description: Адрес электронной почты
  firstDemandDate:
    type: string
    nullable: true
    description: Дата первой продажи
  lastDemandDate:
    type: string
    nullable: true
    description: Дата последней продажи
  demandsCount:
    type: integer
    format: int64
    description: Количество продаж
  demandsSum:
    type: number
    format: double
    description: Сумма продаж
  averageReceipt:
    type: number
    format: double
    description: Средний чек
  returnsCount:
    type: integer
    format: int64
    description: Количество возвратов
  returnsSum:
    type: number
    format: double
    description: Сумма возвратов
  discountsSum:
    type: number
    format: double
    description: Сумма скидок
  balance:
    type: number
    format: double
    description: Баланс
  bonusBalance:
    type: number
    format: double
    description: Баллы
  profit:
    type: number
    format: double
    description: Прибыль.
  lastEventDate:
    type: string
    nullable: true
    description: Дата последнего события
  lastEventText:
    type: string
    maxLength: 255
    nullable: true
    description: Текст последнего события
  updated:
    type: string
    description: Момент последнего изменения контрагента
