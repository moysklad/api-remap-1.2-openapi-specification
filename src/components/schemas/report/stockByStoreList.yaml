type: object
description: Отчет «Остатки по складам»
properties:
  context:
    description: Метаданные о сотруднике, выполнившем запрос
    $ref: '../common/context.yaml'
  meta:
    description: Метаданные о выдаче
    $ref: '../common/metaList.yaml'
  rows:
    type: array
    description: |
      Массив строк отчета. Набор типов строк зависит от параметра запроса `groupBy`
      (см. `meta.type`: product, variant, consignment).
    items:
      description: |
        Логический вид строки в JSON задается `meta.type` (см. описание массива `rows` выше).
      $ref: '../../../openapi.yaml#/components/schemas/StockByStore'
