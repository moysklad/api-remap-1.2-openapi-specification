type: object
description: Строка отчета по документам номенклатуры, отображающего резервы
properties:
  assortment:
    type: object
    description: Метаданные Товара/Модификации/Партии
    properties:
      meta:
        $ref: '../common/meta.yaml'
  operation:
    type: object
    description: Метаданные документа
    properties:
      meta:
        $ref: '../common/meta.yaml'
  moment:
    type: string
    description: Дата документа
  store:
    type: object
    description: Метаданные склада документа
    properties:
      meta:
        $ref: '../common/meta.yaml'
  reserve:
    type: number
    format: double
    description: Резерв
