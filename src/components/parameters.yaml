entityId:
  name: id
  in: path
  required: true
  description: ID сущности
  schema:
    type: string
    format: uuid

positionId:
  name: positionId
  in: path
  required: true
  description: ID позиции
  schema:
    type: string
    format: uuid

publicationId:
  name: publicationId
  in: path
  required: true
  description: ID публикации
  schema:
    type: string
    format: uuid

limit:
  name: limit
  in: query
  description: Максимальное количество элементов в выданном списке (максимум 1000)
  schema:
    type: integer
    minimum: 1
    maximum: 1000
    default: 1000

offset:
  name: offset
  in: query
  description: Отступ в выданном списке
  schema:
    type: integer
    minimum: 0
    default: 0

search:
  name: search
  in: query
  description: Контекстный поиск по строковым полям сущностей
  schema:
    type: string

filter:
  name: filter
  in: query
  description: Фильтрация выборки
  schema:
    type: string

expand:
  name: expand
  in: query
  description: Замена ссылок объектами с помощью expand
  schema:
    type: string

order:
  name: order
  in: query
  description: Сортировка
  schema:
    type: string

entityType:
  name: type
  in: path
  required: true
  schema:
    type: string

fields:
  name: fields
  in: query
  description: |
    Включить в ответ скрытые поля, не выводимые по умолчанию.
    В одном запросе можно передать только одно значение.
    - `minimumStock` — неснижаемый остаток (товар, модификация)
    - `downloadPermanentHref` — постоянная ссылка на изображение (платный тариф)
    - `stock` — остатки и себестоимость в позициях документов
    - `declaration` — прослеживаемость импортных товаров в позициях документов
  schema:
    type: string
    enum:
      - minimumStock
      - downloadPermanentHref
      - stock
      - declaration

stockCurrentInclude:
  name: include
  in: query
  required: false
  description: |
    Управляет включением нулевых остатков.
    По умолчанию выводятся только ненулевые значения.
  schema:
    type: string
    enum:
      - zeroLines

stockCurrentChangedSince:
  name: changedSince
  in: query
  required: false
  description: |
    Выводит фактические остатки по позициям, у которых остаток изменился с указанного момента.
    Формат: `yyyy-MM-dd HH:mm:ss`.
  schema:
    type: string

stockCurrentStockType:
  name: stockType
  in: query
  required: false
  description: |
    Тип рассчитываемого значения остатка. По умолчанию `stock`.
  schema:
    type: string
    enum:
      - stock
      - freeStock
      - quantity
      - reserve
      - inTransit
    default: stock

stockCurrentFilter:
  name: filter
  in: query
  required: false
  description: |
    Фильтрация отчета по ID сущностей.
    Поддерживаемые поля: `assortmentId`, `storeId`.
  schema:
    type: string
