# Допустимые значения заданы через enum, чтобы SDK и Schemathesis не подставляли произвольные/фазовые значения
AcceptHeader:
  name: accept
  in: header
  required: false
  schema:
    type: string
    default: application/json;charset=utf-8
    enum:
      - application/json
      - application/json;charset=utf-8
AcceptEncoding:
  name: Accept-Encoding
  in: header
  required: false
  schema:
    type: string
    default: gzip, deflate, br
    # Убран enum - API принимает любые значения, но может вернуть 415 для неподдерживаемых
LognexAcceptTimezone:
  name: X-Lognex-Accept-Timezone
  in: header
  required: false
  description: |
    Опциональный заголовок, в котором указана текущая дата на клиенте в RFC 3522.
    Таймзону обязательно указывать в формате знак и 4 символа.
    Пример: `Wed, 16 Aug 2017 23:07:01 +0700`.
    При подсчете показателей даты операций смещаются в таймзону клиента.
  schema:
    type: string

# Явный Content-Type для запросов с телом (batch и др.) — чтобы генератор и тесты всегда отправляли application/json
ContentTypeJson:
  name: Content-Type
  in: header
  required: false
  schema:
    type: string
    default: application/json
    enum:
      - application/json